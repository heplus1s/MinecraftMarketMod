name: Build integrated mod
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check client/server packaging
        run: python3 scripts/check_embedded_ui.py
      - name: Compile and test core plus client
        run: bash gradlew --no-daemon build
      - name: Verify remapped release jar
        run: python3 scripts/check_release_jar.py
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-mod-jars
          path: build/libs/marketmod-1.0.17.jar
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no-release]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: integrated-mod-jars
          path: release-jars
      - name: Publish versioned release without replacing existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.17 >/dev/null 2>&1; then
            echo "Release v1.0.17 already exists; refusing to replace it."
            exit 1
          fi
          if gh api repos/heplus1s/MinecraftMarketMod/git/ref/tags/v1.0.17 >/dev/null 2>&1; then
            echo "Tag v1.0.17 already exists; refusing to move it."
            exit 1
          fi
          gh release view v1.0.17 --repo heplus1s/MinecraftLandMod >/dev/null
          gh release view v1.0.23 --repo heplus1s/MinecraftBankMod >/dev/null
          gh release view v1.0.10 --repo heplus1s/MinecraftShopMod >/dev/null
          gh release create v1.0.17 release-jars/marketmod-1.0.17.jar --target "$GITHUB_SHA" --title "v1.0.17 系统回购页面" --notes-file RELEASE_NOTES_1.0.17.md
